name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main-js-path: ${{ steps.build.outputs.main-js-path }}
      styles-css-path: ${{ steps.build.outputs.styles-css-path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - id: build
        run: |
          echo "main-js-path=main.js" >> $GITHUB_OUTPUT
          echo "styles-css-path=styles.css" >> $GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Attest build provenance for main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: main.js

      - name: Attest build provenance for styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            main.js
            styles.css
            manifest.json
            main.js.intoto.jsonl
            styles.css.intoto.jsonl
